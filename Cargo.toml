[workspace]
resolver = "2"
members = [
    "crates/boardghost-cli",
    "crates/boardghost-launcher/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
tera = "1"
tempfile = "3"
thiserror = "1"
regex = "1"
