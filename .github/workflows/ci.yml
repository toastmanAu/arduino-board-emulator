name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install host deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsdl2-dev libcurl4-openssl-dev
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Arduino libs
        run: |
          arduino-cli config init
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install LovyanGFX
          arduino-cli lib install lvgl
          arduino-cli lib install ArduinoJson

      - uses: dtolnay/rust-toolchain@stable

      - name: Cargo test (CLI only)
        # The launcher crate pulls in Tauri + GTK system deps that this
        # job intentionally doesn't install. Launcher tests run in the
        # dedicated `launcher-build` job below.
        run: cargo test -p boardghost-cli

      - name: Build runtime + GoogleTest
        run: |
          cmake -S runtime -B runtime/build
          cmake --build runtime/build -j
          ctest --test-dir runtime/build --output-on-failure

      - name: E2E — hello_serial
        run: ./tests/e2e/run_hello_serial.sh
      - name: E2E — ssd1306_text
        run: ./tests/e2e/run_ssd1306_text.sh
      - name: E2E — lvgl_hello_ili9488
        run: ./tests/e2e/run_lvgl_hello.sh
      - name: E2E — cryptoticker_smoke (M2.C)
        run: ./tests/e2e/cryptoticker_smoke.sh
        env:
          BOARDGHOST_NET: fake
      - name: E2E — lgfx_codemod_smoke (M2.E)
        run: ./tests/e2e/lgfx_codemod_smoke.sh
        env:
          BOARDGHOST_NET: fake

  launcher-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Tauri host deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsdl2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install npm deps
        working-directory: crates/boardghost-launcher
        run: npm ci

      - name: Type-check frontend
        working-directory: crates/boardghost-launcher
        run: npm run check

      - name: Build frontend (needed by tauri::generate_context!)
        working-directory: crates/boardghost-launcher
        run: npm run build

      - name: Cargo test (launcher backend)
        run: cargo test -p boardghost-launcher

      - name: Build launcher (debug, no bundle)
        working-directory: crates/boardghost-launcher
        run: npm run tauri build -- --debug --no-bundle
