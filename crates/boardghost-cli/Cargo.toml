[package]
name = "boardghost-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "boardghost"
path = "src/main.rs"

[lib]
name = "boardghost"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
# 0.8 switched to the RustCrypto Digest trait; 0.7's md5::compute() matches espota usage.
md5 = "0.7"
clap.workspace = true
libc = "0.2"
serde.workspace = true
toml.workspace = true
serde_json = { workspace = true }
tera.workspace = true
thiserror.workspace = true
regex = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
